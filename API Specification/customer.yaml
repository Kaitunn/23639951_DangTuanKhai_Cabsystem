openapi: 3.0.3
info:
  title: CAB System API - Customer
  description: Hồ sơ khách hàng (FR03)
  version: "1.0.0"
servers:
  - url: /api/v1

security:
  - bearerAuth: []

paths:
  /customers/{customerId}:
    get:
      tags: [Customer]
      operationId: getCustomerProfile
      summary: Xem thông tin hồ sơ khách hàng
      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Thông tin khách hàng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "401":
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Không tìm thấy khách hàng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [Customer]
      operationId: updateCustomerProfile
      summary: Cập nhật hồ sơ khách hàng (FR03, AC03)
      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: { type: string }
                email: { type: string }
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Không tìm thấy khách hàng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Customer:
      type: object
      properties:
        customerId: { type: string }
        fullName: { type: string }
        phone: { type: string }
        email: { type: string }
    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
