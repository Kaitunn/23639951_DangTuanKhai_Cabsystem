/customers/{customerId}:
  get:
    tags: [Customer]
    summary: Xem thông tin hồ sơ khách hàng
    parameters:
      - name: customerId
        in: path
        required: true
        schema: { type: string }
    responses:
      "200":
        description: Thông tin khách hàng
  put:
    tags: [Customer]
    summary: Cập nhật hồ sơ khách hàng (FR03, AC03)
    parameters:
      - name: customerId
        in: path
        required: true
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              fullName: { type: string }
              email: { type: string }
    responses:
      "200":
        description: Cập nhật thành công
