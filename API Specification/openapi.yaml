openapi: 3.0.3
info:
  title: CAB System API
  description: >
    API cho hệ thống đặt xe CAB System (Công ty ABC).
    Mỗi domain (Auth, Customer, Trip, Driver, Payment, Rating, Admin)
    được định nghĩa ở 1 file riêng trong thư mục /paths.
  version: "1.0.0"
servers:
  - url: /api/v1

tags:
  - name: Auth
    description: Đăng ký / đăng nhập (FR01, FR02, FR16, FR33)
  - name: Customer
    description: Hồ sơ khách hàng (FR03)
  - name: Trip
    description: Yêu cầu đặt xe, theo dõi, lịch sử chuyến (FR04-FR15, FR20, FR35, FR36)
  - name: Driver
    description: Hồ sơ, trạng thái, vị trí tài xế (FR16-FR19)
  - name: Payment
    description: Tính cước, thanh toán (FR21-FR24)
  - name: Rating
    description: Đánh giá tài xế (FR37)
  - name: Admin
    description: Quản trị vận hành (FR27-FR32)

paths:
  /auth/register:
    $ref: './paths/auth.yaml#/~1auth~1register/post'
  /auth/login:
    $ref: './paths/auth.yaml#/~1auth~1login/post'

  /customers/{customerId}:
    $ref: './paths/customer.yaml#/~1customers~1{customerId}'

  /trips:
    $ref: './paths/trip.yaml#/~1trips'
  /trips/{tripId}:
    $ref: './paths/trip.yaml#/~1trips~1{tripId}'
  /trips/{tripId}/status:
    $ref: './paths/trip.yaml#/~1trips~1{tripId}~1status'
  /trips/{tripId}/assign-driver:
    $ref: './paths/trip.yaml#/~1trips~1{tripId}~1assign-driver'
  /trips/{tripId}/driver-response:
    $ref: './paths/trip.yaml#/~1trips~1{tripId}~1driver-response'

  /drivers/register:
    $ref: './paths/driver.yaml#/~1drivers~1register'
  /drivers/{driverId}:
    $ref: './paths/driver.yaml#/~1drivers~1{driverId}'
  /drivers/{driverId}/availability:
    $ref: './paths/driver.yaml#/~1drivers~1{driverId}~1availability'
  /drivers/{driverId}/location:
    $ref: './paths/driver.yaml#/~1drivers~1{driverId}~1location'

  /trips/{tripId}/payment:
    $ref: './paths/payment.yaml#/~1trips~1{tripId}~1payment'

  /trips/{tripId}/rating:
    $ref: './paths/rating.yaml#/~1trips~1{tripId}~1rating'

  /admin/trips:
    $ref: './paths/admin.yaml#/~1admin~1trips'
  /admin/trips/{tripId}/resolve:
    $ref: './paths/admin.yaml#/~1admin~1trips~1{tripId}~1resolve'
  /admin/reports:
    $ref: './paths/admin.yaml#/~1admin~1reports'

components:
  schemas:
    Trip:
      $ref: './components/schemas.yaml#/Trip'
    Driver:
      $ref: './components/schemas.yaml#/Driver'
    Customer:
      $ref: './components/schemas.yaml#/Customer'
